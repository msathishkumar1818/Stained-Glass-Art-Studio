<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <rect width="44" height="44" rx="8" fill="#0E0E12"/>
  <!-- Four jewel-coloured panes -->
  <rect x="3" y="3" width="17" height="17" rx="2" fill="#1A4472"/>
  <rect x="24" y="3" width="17" height="17" rx="2" fill="#8B1520"/>
  <rect x="3" y="24" width="17" height="17" rx="2" fill="#1A5C3A"/>
  <rect x="24" y="24" width="17" height="17" rx="2" fill="#D4952A"/>
  <!-- Light sheen -->
  <rect x="3" y="3" width="17" height="7" rx="2" fill="white" opacity="0.2"/>
  <rect x="24" y="3" width="17" height="7" rx="2" fill="white" opacity="0.2"/>
  <!-- Lead came -->
  <rect x="20" y="0" width="4" height="44" fill="#0E0E12"/>
  <rect x="0" y="20" width="44" height="4" fill="#0E0E12"/>
  <!-- Centre diamond jewel -->
  <rect x="18.5" y="18.5" width="7" height="7" fill="#C49A2A" transform="rotate(45 22 22)"/>
</svg>
